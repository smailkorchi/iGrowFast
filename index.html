<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>iGrowFast — Pilotez votre e-commerce sans dix onglets</title>
    <meta name="description" content="Commandes, livraisons, paiements, campagnes — tout atterrit au même endroit. iGrowFast orchestre ce qui comptait hier sur dix onglets." />
    <meta name="author" content="iGrowFast" />
    <meta name="application-name" content="iGrowFast" />
    <link rel="canonical" href="https://igrowfast.com/" />

    <link rel="icon" type="image/png" href="/Logo/iGrowFast Icon Transparent.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iGrowFast" />
    <meta property="og:title" content="iGrowFast — Pilotez votre e-commerce sans dix onglets" />
    <meta property="og:description" content="Commandes, livraisons, paiements, campagnes — tout atterrit au même endroit. iGrowFast orchestre ce qui comptait hier sur dix onglets." />
    <meta property="og:url" content="https://igrowfast.com/" />
    <meta property="og:image" content="https://igrowfast.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://igrowfast.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="iGrowFast — Le poste de pilotage de votre e-commerce" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@igrowfast" />
    <meta name="twitter:title" content="iGrowFast — Pilotez votre e-commerce sans dix onglets" />
    <meta name="twitter:description" content="Commandes, livraisons, paiements, campagnes — tout atterrit au même endroit. iGrowFast orchestre ce qui comptait hier sur dix onglets." />
    <meta name="twitter:image" content="https://igrowfast.com/og-image.png" />
    <meta name="twitter:image:alt" content="iGrowFast — Le poste de pilotage de votre e-commerce" />

    <!-- ─── PWA / Web Push ─── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="color-scheme" content="light" />

    <!-- iOS Safari: "Add to Home Screen" PWA support. This is the ONLY way
         web push notifications work on iPhones — iOS only permits
         Notification API and Push API inside installed PWAs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iGrowFast" />
    <link rel="apple-touch-icon" href="/Logo/iGrowFast Icon Transparent.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Logo/iGrowFast Icon Transparent.png" />

    <!-- Brand fonts: Poppins (display) + Lora (serif) + Inter (body UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
