<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>DigiCom</title>
    <link rel="icon" type="image/png" href="/Logo/DigiCom Icon Transparent.png" />
    <meta name="description" content="DigiCom Management System" />
    <meta name="author" content="DigiCom" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="DigiCom" />
    <meta property="og:description" content="DigiCom Management System" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- ─── PWA / Web Push ─── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="color-scheme" content="light" />

    <!-- iOS Safari: "Add to Home Screen" PWA support. This is the ONLY way
         web push notifications work on iPhones — iOS only permits
         Notification API and Push API inside installed PWAs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DigiCom" />
    <link rel="apple-touch-icon" href="/Logo/DigiCom Icon Transparent.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Logo/DigiCom Icon Transparent.png" />

    <!-- Anthropic brand fonts: Poppins (display) + Lora (serif) + Inter (body UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
